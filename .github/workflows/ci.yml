name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Cache WASM build artifacts
        id: wasm-cache
        uses: actions/cache@v6
        with:
          path: |
            cuckarooz.wasm
            cuckarooz.js
          key: ${{ runner.os }}-cuckoo-wasm-${{ hashFiles('src/**', 'index.js', 'adapter.js', 'Dockerfile') }}

      - name: Build WASM library via Emscripten Docker
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Build npm package
        run: npm pack

      - name: Upload npm package artifact
        uses: actions/upload-artifact@v7
        with:
          name: npm-package
          path: '*.tgz'
